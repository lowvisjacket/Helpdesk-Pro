name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maven:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            pom.xml
            gateway/pom.xml
      - name: Test ticketing application
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Test Spring Cloud Gateway
        run: ./mvnw --batch-mode --no-transfer-progress -f gateway/pom.xml verify
