# Test configuration. Replaces the main application.properties on the test classpath,
# so tests never need MySQL, Docker, or environment variables.
spring.profiles.active=demo
demo.seed.count=61

spring.datasource.url=jdbc:h2:mem:helpdesk_pro;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Run src/test/resources/data.sql after Hibernate has created the tables.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
