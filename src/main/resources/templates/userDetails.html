<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: page(${user.firstName + ' ' + user.lastName}, 'users', ~{::main})}">
<body>
<main class="view" th:with="sys=${#authorization.expression('hasRole(''SYSADMIN'')')},
                            admin=${#authorization.expression('hasAnyRole(''ADMIN'',''SYSADMIN'')')},
                            target=${user.role != null and user.role.name() == 'SYSADMIN'},
                            self=${user.username == #authentication.name}">
  <div class="narrow" th:with="canEdit=${admin and (sys or !target)}">
    <a class="back" th:href="@{/dashboard/users}">‹ Users</a>
    <div class="head">
      <h1 th:text="${user.firstName + ' ' + user.lastName}">Name</h1>
      <span class="badge" th:classappend="${user.accountStatus} ? 'st-on' : 'st-off'" th:text="${user.accountStatus ? 'Active' : 'Disabled'}">Active</span>
    </div>

    <!--/* Administrators can edit. Only a system administrator can edit another system administrator. */-->
    <form th:if="${canEdit}" class="card pad" method="post" th:action="@{/dashboard/users/{username}/update(username=${user.username})}">
      <label class="field"><span>Username</span><input class="input" th:value="${user.username}" readonly></label>
      <label class="field"><span>First name</span><input class="input" name="firstName" th:value="${user.firstName}" required maxlength="80"></label>
      <label class="field"><span>Last name</span><input class="input" name="lastName" th:value="${user.lastName}" required maxlength="80"></label>
      <label class="field"><span>Department</span>
        <input class="input" name="department" th:value="${user.department}" list="departments" required>
        <datalist id="departments"><option th:each="d : ${@fmt.departments()}" th:value="${d}"></option></datalist></label>
      <label class="field"><span>Role</span>
        <select class="input" name="role">
          <option th:each="r : ${@fmt.roles()}" th:if="${sys or r.name() != 'SYSADMIN'}" th:value="${r}" th:text="${@fmt.label(r)}" th:selected="${r == user.role}">Role</option>
        </select></label>
      <button class="btn tint" type="submit">Save changes</button>
    </form>

    <!--/* Everyone else sees a read-only summary. */-->
    <div th:unless="${canEdit}" class="card">
      <div class="kv"><span>Username</span><span class="val mono" th:text="${user.username}">username</span></div>
      <div class="kv"><span>Department</span><span class="val" th:text="${@fmt.label(user.department)}">Dept</span></div>
      <div class="kv"><span>Role</span><span class="val" th:text="${@fmt.label(user.role)}">Role</span></div>
    </div>

    <div th:if="${canEdit}" class="card" style="margin-top:1rem">
      <h3>Account</h3>
      <div class="kv"><span>Failed sign-in attempts</span><span class="val" th:text="${user.loginAttempts ?: 0}">0</span></div>
      <div class="kv" th:if="${!self}">
        <span th:text="${user.accountStatus ? 'Disable account' : 'Enable account'}">Disable<small></small></span>
        <form method="post" th:action="@{/dashboard/users/{username}/toggle(username=${user.username})}">
          <button class="btn" type="submit" th:classappend="${user.accountStatus} ? 'danger'" th:text="${user.accountStatus ? 'Disable' : 'Enable'}">Disable</button></form>
      </div>
      <div class="kv" th:if="${sys and !self}">
        <span>Delete account<small>This cannot be undone.</small></span>
        <form method="post" th:action="@{/dashboard/users/{username}/delete(username=${user.username})}"
              th:data-confirm="'Delete ' + ${user.username} + '? This cannot be undone.'"><button class="btn danger" type="submit">Delete</button></form>
      </div>
    </div>
  </div>
</main>
</body>
</html>
