<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create User | HelpDesk Pro</title>
    <style>
        body {
            background: #f3f6fb;
            color: #1f2937;
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            margin: 0;
            padding: 40px 16px;
        }
        main {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            margin: 0 auto;
            max-width: 560px;
            padding: 28px;
        }
        h1 { margin-top: 0; }
        label { display: block; font-weight: 600; margin: 16px 0 6px; }
        input, select {
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font: inherit;
            padding: 10px;
            width: 100%;
        }
        .actions { display: flex; gap: 12px; margin-top: 24px; }
        button, a {
            background: #2563eb;
            border: 0;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            font: inherit;
            padding: 10px 16px;
            text-decoration: none;
        }
        a { background: #64748b; }
    </style>
</head>
<body>
<main>
    <h1>Create user</h1>
    <p>New accounts start enabled. Use a unique username and a password with at least 12 characters.</p>
    <form th:action="@{/dashboard/users/create}" th:object="${user}" method="post">
        <label for="firstName">First name</label>
        <input id="firstName" type="text" th:field="*{firstName}" required>
        <label for="lastName">Last name</label>
        <input id="lastName" type="text" th:field="*{lastName}" required>
        <label for="username">Username</label>
        <input id="username" type="text" th:field="*{username}" pattern="[a-zA-Z0-9._-]{3,32}" required>
        <label for="password">Temporary password</label>
        <input id="password" type="password" th:field="*{password}" minlength="12" autocomplete="new-password" required>
        <label for="department">Department</label>
        <select id="department" th:field="*{department}" required>
            <option value="INFORMATION_TECHNOLOGY">Information Technology</option>
            <option value="HUMAN_RESOURCES">Human Resources</option>
            <option value="ENGINEERING">Engineering</option>
            <option value="MAINTENANCE">Maintenance</option>
            <option value="CLINICAL_INFORMATICS">Clinical Informatics</option>
            <option value="SECURITY">Security</option>
            <option value="MARKETING">Marketing</option>
            <option value="FINANCE">Finance</option>
        </select>
        <label for="role">Role</label>
        <select id="role" th:field="*{role}" required>
            <option value="USER">User</option>
            <option value="TECHNICIAN">Technician</option>
            <option value="ADMIN">Administrator</option>
            <option value="SYSADMIN">System administrator</option>
        </select>
        <div class="actions">
            <button type="submit">Create account</button>
            <a th:href="@{/dashboard/users}">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
