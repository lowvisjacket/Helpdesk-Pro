<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('New user', 'users', ~{::main})}">
<body>
<main class="view" th:with="sys=${#authorization.expression('hasRole(''SYSADMIN'')')}">
  <div class="narrow">
    <a class="back" th:href="@{/dashboard/users}">‹ Users</a>
    <div class="head"><h1>New user</h1></div>
    <form class="card pad" method="post" th:action="@{/dashboard/users/create}" th:object="${user}" autocomplete="off">
      <label class="field"><span>First name</span><input class="input" th:field="*{firstName}" required maxlength="80"></label>
      <label class="field"><span>Last name</span><input class="input" th:field="*{lastName}" required maxlength="80"></label>
      <label class="field"><span>Username</span>
        <input class="input" th:field="*{username}" required pattern="[a-zA-Z0-9._\-]{3,32}" autocapitalize="none" spellcheck="false">
        <small>3 to 32 letters, numbers, dots, dashes or underscores.</small></label>
      <label class="field"><span>Temporary password</span>
        <input class="input" type="password" th:field="*{password}" required minlength="12" autocomplete="new-password">
        <small>At least 12 characters. Share it with the user securely.</small></label>
      <label class="field"><span>Department</span>
        <select class="input" th:field="*{department}" required>
          <option value="">Choose a department</option>
          <option th:each="d : ${@fmt.departments()}" th:value="${d}" th:text="${@fmt.label(d)}">Dept</option>
        </select></label>
      <label class="field"><span>Role</span>
        <select class="input" th:field="*{role}" required>
          <option th:each="r : ${@fmt.roles()}" th:if="${sys or r.name() != 'SYSADMIN'}" th:value="${r}" th:text="${@fmt.label(r)}">Role</option>
        </select></label>
      <button class="btn tint" type="submit">Create user</button>
      <a class="btn plain" th:href="@{/dashboard/users}">Cancel</a>
    </form>
  </div>
</main>
</body>
</html>
