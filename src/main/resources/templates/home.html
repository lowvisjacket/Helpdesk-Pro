<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('My tickets', 'tickets', ~{::main})}">
<body>
<main class="view">
  <div class="head">
    <h1>My tickets</h1>
    <span class="sub" th:text="${@fmt.count(tickets.size(), 'ticket', 'tickets')}">0 tickets</span>
  </div>
  <div class="card" data-live>
    <div class="table-wrap">
      <table th:if="${!#lists.isEmpty(tickets)}">
        <thead><tr><th>ID</th><th>Subject</th><th>Status</th><th class="hide-sm">Priority</th><th class="hide-sm">Opened</th></tr></thead>
        <tbody>
        <tr th:each="t : ${tickets}" th:data-href="@{/tickets/{id}(id=${t.id})}">
          <td class="mono" th:text="${t.id}">1</td>
          <td class="subj"><a th:href="@{/tickets/{id}(id=${t.id})}" th:text="${t.title}">Subject</a><div class="m" th:text="${@fmt.label(t.department)}">Dept</div></td>
          <td><span th:replace="~{parts :: status(${t.ticketStatus})}"></span></td>
          <td class="hide-sm"><span th:replace="~{parts :: prio(${t.importance})}"></span></td>
          <td class="hide-sm sub"><time th:replace="~{parts :: day(${t.ticketDate}, ${t.ticketTime})}"></time></td>
        </tr>
        </tbody>
      </table>
    </div>
    <div class="empty" th:if="${#lists.isEmpty(tickets)}">You haven't opened any tickets yet. <a th:href="@{/create}">Create your first ticket</a></div>
  </div>
</main>
</body>
</html>
