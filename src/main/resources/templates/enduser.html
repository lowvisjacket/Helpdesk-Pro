<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <title>My Tickets</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Inter", Arial, sans-serif;
        }


        body{
            background:#f8fafc;
            color:#1e293b;
        }



        /* HEADER */

        header{

            height:75px;

            background:white;

            border-bottom:1px solid #e2e8f0;

            display:flex;

            justify-content:space-between;

            align-items:center;

            padding:0 40px;

        }



        .brand{

            font-size:24px;

            font-weight:700;

            color:#2563eb;

        }



        .user-area{

            display:flex;

            align-items:center;

            gap:20px;

        }



        .logout{

            background:#ef4444;

            color:white;

            border:none;

            padding:10px 18px;

            border-radius:8px;

            cursor:pointer;

            font-weight:600;

        }




        /* CONTENT */


        .container{

            padding:35px;

            max-width:1200px;

            margin:auto;

        }



        .page-title{

            font-size:28px;

            font-weight:700;

            margin-bottom:25px;

        }




        /* TICKET CARDS */


        .ticket-grid{

            display:grid;

            grid-template-columns:repeat(auto-fit,minmax(350px,1fr));

            gap:25px;

        }




        .ticket-card{

            background:white;

            border-radius:14px;

            padding:25px;

            box-shadow:0 4px 15px rgba(0,0,0,.06);

            transition:.2s;

        }



        .ticket-card:hover{

            transform:translateY(-3px);

            box-shadow:0 8px 20px rgba(0,0,0,.1);

        }




        .ticket-header{

            display:flex;

            justify-content:space-between;

            align-items:center;

            margin-bottom:20px;

        }



        .ticket-title{

            font-size:20px;

            font-weight:700;

            color:#0f172a;

        }




        .badge{

            padding:6px 14px;

            border-radius:20px;

            font-size:12px;

            font-weight:bold;

        }




        .open{

            background:#dcfce7;

            color:#166534;

        }



        .progress{

            background:#fef3c7;

            color:#92400e;

        }



        .resolved{

            background:#dbeafe;

            color:#1e40af;

        }



        .closed{

            background:#e5e7eb;

            color:#374151;

        }





        .details{

            display:grid;

            grid-template-columns:1fr 1fr;

            gap:15px;

            margin-bottom:20px;

        }



        .detail label{

            display:block;

            color:#64748b;

            font-size:13px;

            margin-bottom:5px;

        }



        .detail span{

            font-weight:600;

        }





        .description{

            background:#f8fafc;

            border-radius:10px;

            padding:15px;

            color:#475569;

            margin-bottom:20px;

        }





        .button{

            width:100%;

            padding:11px;

            border:none;

            background:#2563eb;

            color:white;

            border-radius:8px;

            font-weight:600;

            cursor:pointer;

        }



        .button:hover{

            background:#1d4ed8;

        }




        .empty{

            background:white;

            padding:40px;

            text-align:center;

            border-radius:14px;

            color:#64748b;

        }




        @media(max-width:700px){

            .details{

                grid-template-columns:1fr;

            }


            header{

                padding:0 20px;

            }

        }


    </style>


</head>


<body>



<header>


    <div class="brand">
        HelpDesk Pro
    </div>


    <div class="user-area">


        <span th:text="${username}">
            User
        </span>


        <form th:action="@{/logout}" method="post">

            <button class="logout">
                Logout
            </button>

        </form>


    </div>


</header>





<div class="container">


    <div class="page-title">
        My Tickets
    </div>




    <div class="ticket-grid">



        <div class="empty"
             th:if="${#lists.isEmpty(tickets)}">

            You have not submitted any tickets yet.

        </div>





        <div class="ticket-card"
             th:each="ticket:${tickets}">



            <div class="ticket-header">


                <div class="ticket-title"
                     th:text="${ticket.title}">

                    Ticket Title

                </div>



                <span class="badge"

                      th:classappend="
                      ${ticket.ticketStatus=='OPEN'}?' open':
                      (${ticket.ticketStatus=='IN_PROGRESS'}?' progress':
                      (${ticket.ticketStatus=='RESOLVED'}?' resolved':' closed'))"

                      th:text="${ticket.ticketStatus}">

                </span>


            </div>





            <div class="details">


                <div class="detail">

                    <label>
                        Priority
                    </label>

                    <span th:text="${ticket.importance}">
                    </span>

                </div>




                <div class="detail">

                    <label>
                        Department
                    </label>

                    <span th:text="${ticket.department}">
                    </span>

                </div>





                <div class="detail">

                    <label>
                        Created
                    </label>

                    <span th:text="${ticket.ticketDate + ' ' + ticket.ticketTime}">
                    </span>

                </div>





                <div class="detail">

                    <label>
                        Assigned Agent
                    </label>

                    <span th:text="${ticket.agent != null ? ticket.agent : 'Unassigned'}">
                    </span>

                </div>


            </div>





            <div class="description">

                <strong>
                    Description
                </strong>

                <p th:text="${ticket.description}">
                </p>

            </div>





            <form th:action="@{/dashboard/details/{id}(id=${ticket.id})}"
                  method="get">

                <button class="button">

                    View Ticket

                </button>

            </form>



        </div>



    </div>


</div>



</body>

</html>
