<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <title>Account Disabled</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Inter",Arial,sans-serif;
        }

        body{
            height:100vh;
            background:#f8fafc;
            display:flex;
            justify-content:center;
            align-items:center;
            color:#1e293b;
        }

        .container{

            background:white;
            width:450px;
            padding:40px;
            border-radius:16px;
            text-align:center;
            box-shadow:0 8px 25px rgba(0,0,0,.08);

        }


        .icon{

            width:80px;
            height:80px;
            margin:0 auto 25px;

            background:#fee2e2;
            color:#dc2626;

            border-radius:50%;

            display:flex;
            align-items:center;
            justify-content:center;

            font-size:40px;
            font-weight:bold;

        }


        h1{

            font-size:28px;
            margin-bottom:15px;
            color:#0f172a;

        }


        p{

            color:#64748b;
            line-height:1.6;
            margin-bottom:25px;

        }


        .contact{

            background:#f8fafc;
            padding:18px;
            border-radius:10px;
            margin-bottom:25px;

        }


        .contact strong{

            color:#2563eb;

        }


        .button{

            display:inline-block;

            background:#2563eb;
            color:white;

            text-decoration:none;

            padding:12px 24px;

            border-radius:8px;

            font-weight:600;

        }


        .button:hover{

            background:#1d4ed8;

        }


        .brand{

            margin-top:25px;
            font-size:20px;
            font-weight:700;
            color:#2563eb;

        }


    </style>

</head>


<body>


<div class="container">


    <div class="icon">
        !
    </div>


    <h1>
        Account Disabled
    </h1>


    <p>
        Your account has been disabled by IT.
        You are currently unable to access HelpDesk Pro.
    </p>


    <div class="contact">

        If you believe this was done in error,
        please contact your IT department for assistance.

    </div>


    <a href="mailto:it@company.com"
       class="button">

        Contact IT

    </a>


    <div class="brand">
        HelpDesk Pro
    </div>


</div>


</body>

</html>
