<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Ticket Details</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Inter",Arial,sans-serif;
        }

        body{
            background:#f8fafc;
            color:#1e293b;
        }

        /* Header */

        header{
            height:75px;
            background:white;
            border-bottom:1px solid #e2e8f0;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:0 40px;
        }

        .brand{
            font-size:24px;
            font-weight:700;
            color:#2563eb;
        }

        .logout{
            background:#ef4444;
            color:white;
            border:none;
            padding:10px 18px;
            border-radius:8px;
            cursor:pointer;
            font-weight:600;
        }

        .container{
            max-width:1100px;
            margin:35px auto;
            padding:0 20px;
        }

        .ticket-header{
            background:white;
            padding:30px;
            border-radius:14px;
            box-shadow:0 4px 15px rgba(0,0,0,.06);
            margin-bottom:25px;
        }

        .ticket-title{
            font-size:28px;
            font-weight:700;
            margin-bottom:20px;
        }

        .badge{
            display:inline-block;
            padding:6px 14px;
            border-radius:20px;
            font-size:13px;
            font-weight:bold;
            margin-top:15px;
        }

        .open{
            background:#dcfce7;
            color:#166534;
        }

        .progress{
            background:#fef3c7;
            color:#92400e;
        }

        .resolved{
            background:#dbeafe;
            color:#1e40af;
        }

        .closed{
            background:#e5e7eb;
            color:#374151;
        }

        .card{
            background:white;
            padding:25px;
            border-radius:14px;
            box-shadow:0 4px 15px rgba(0,0,0,.05);
            margin-bottom:25px;
        }

        .grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:20px;
            margin-bottom:25px;
        }

        .field label{
            display:block;
            color:#64748b;
            font-size:13px;
            margin-bottom:5px;
        }

        .field span{
            font-weight:600;
        }

        .description{
            background:#f8fafc;
            padding:18px;
            border-radius:10px;
            line-height:1.6;
            color:#475569;
        }

        .comment-wrapper{
    display:flex;
    margin-bottom:18px;
}

.comment{
    max-width:70%;
    padding:18px;
    border-radius:14px;
    word-wrap:break-word;
}

.comment-header{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
    gap:20px;
}

.comment-user{
    font-weight:bold;
}

.comment-date{
    font-size:12px;
    opacity:.8;
}

/* Comments from other users */

.other-comment{
    justify-content:flex-start;
}

.other-comment .comment{
    background:#f1f5f9;
    border-left:4px solid #64748b;
}

.other-comment .comment-user{
    color:#475569;
}

/* Comments from the logged-in user */

.own-comment{
    justify-content:flex-end;
}

.own-comment .comment{
    background:#2563eb;
    color:white;
    border-right:4px solid #1d4ed8;
}

.own-comment .comment-user,
.own-comment .comment-date{
    color:white;
}

        textarea{
            width:100%;
            min-height:120px;
            padding:12px;
            border:1px solid #e2e8f0;
            border-radius:8px;
            resize:vertical;
            margin-top:15px;
        }

        .buttons{
            display:flex;
            justify-content:space-between;
            margin-top:25px;
            gap:15px;
            flex-wrap:wrap;
        }

        .btn{
            border:none;
            border-radius:8px;
            padding:12px 22px;
            cursor:pointer;
            font-weight:600;
        }

        .back-btn{
            background:#64748b;
            color:white;
        }

        .comment-btn{
            background:#0f766e;
            color:white;
        }

        .btn:hover{
            opacity:.9;
        }

        @media(max-width:700px){

            header{
                padding:0 20px;
            }

            .buttons{
                flex-direction:column;
            }

            .buttons .btn{
                width:100%;
            }

        }

    </style>

</head>

<body>

<header>

    <div class="brand">
        HelpDesk Pro
    </div>

    <form th:action="@{/logout}" method="post">
        <button class="logout">
            Logout
        </button>
    </form>

</header>

<div class="container">

    <div class="ticket-header">

        <div class="ticket-title"
             th:text="${ticket.title}">
            Ticket Title
        </div>

        <span class="badge"
              th:classappend="
                ${ticket.ticketStatus=='OPEN'}?' open':
                (${ticket.ticketStatus=='IN_PROGRESS'}?' progress':
                (${ticket.ticketStatus=='RESOLVED'}?' resolved':' closed'))"
              th:text="${ticket.ticketStatus}">
        </span>

    </div>

    <div class="card">

        <h3>Ticket Information</h3>

        <br>

        <div class="grid">

            <div class="field">
                <label>Priority</label>
                <span th:text="${ticket.importance}"></span>
            </div>

            <div class="field">
                <label>Department</label>
                <span th:text="${ticket.department}"></span>
            </div>

            <div class="field">
                <label>Assigned Agent</label>
                <span th:text="${ticket.agent != null ? ticket.agent : 'Unassigned'}"></span>
            </div>

            <div class="field">
                <label>Date</label>
                <span th:text="${ticket.ticketDate}"></span>
            </div>

            <div class="field">
                <label>Time</label>
                <span th:text="${ticket.ticketTime}"></span>
            </div>

        </div>

        <label><strong>Description</strong></label>

        <div class="description"
             th:text="${ticket.description}">
        </div>

    </div>

    <div class="card">

        <h3>Conversation</h3>

        <br>

        <div th:if="${#lists.isEmpty(ticket.notes)}">
            No comments yet.
        </div>

        <div th:each="note : ${ticket.notes}"
             class="comment-wrapper"
             th:classappend="${note.username == username} ? ' own-comment' : ' other-comment'">

            <div class="comment">

                <div class="comment-header">

            <span class="comment-user"
                  th:text="${note.username}">
                User
            </span>

                    <span class="comment-date"
                          th:text="${note.ticketNoteDate + ' ' + note.ticketNoteTime}">
                Date
            </span>

                </div>

                <p th:text="${note.note}">
                    Comment
                </p>

            </div>

        </div>

        <form th:action="@{/tickets/{id}/newnote(id=${ticket.id})}"
              method="post">

            <h3 style="margin-top:30px;">Add Comment</h3>

            <textarea name="note"
                      placeholder="Write your comment..."
                      required></textarea>

            <div class="buttons">

                <button type="button"
                        class="btn back-btn"
                        onclick="window.location.href='/home'">
                    Back to My Tickets
                </button>

                <button type="submit"
                        class="btn comment-btn">
                    Add Comment
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
