<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ticket Submitted</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f5f7fb;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 450px;
            padding: 40px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,.15);
        }

        .checkmark {
            font-size: 60px;
            color: #198754;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            background: #1976d2;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
        }

        .btn:hover {
            background: #1565c0;
        }

    </style>

</head>


<body>


<div class="container">

    <div class="checkmark">
        ✓
    </div>

    <h1>Ticket Submitted!</h1>

    <p>
        Your ticket has been successfully created.
        Our support team will review it and respond as soon as possible.
    </p>


    <a th:href="@{/}" class="btn">
        Return Home
    </a>


</div>


</body>

</html>
