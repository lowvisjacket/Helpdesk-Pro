<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Reports', 'reports', ~{::main})}">
<body>
<main class="view">
  <div class="head"><h1>Reports</h1></div>
  <div class="stats">
    <div class="card stat"><b th:text="${@fmt.number(totalTickets)}">0</b><span>All tickets</span></div>
    <div class="card stat"><b th:text="${@fmt.number(openTickets)}">0</b><span>Open</span></div>
    <div class="card stat"><b th:text="${@fmt.number(progressTickets)}">0</b><span>In progress</span></div>
    <div class="card stat"><b th:text="${@fmt.number(resolvedTickets)}">0</b><span>Resolved</span></div>
    <div class="card stat"><b th:text="${@fmt.number(closedTickets)}">0</b><span th:text="'Closed (' + ${closedPercentage} + '%)'">Closed</span></div>
    <div class="card stat"><b th:text="${@fmt.number(criticalTickets)}">0</b><span>Critical priority</span></div>
  </div>
  <div class="cols">
    <div class="card" style="padding-bottom:.5rem">
      <h3>Share of all tickets</h3>
      <div class="meter"><div><span>Open</span><span th:text="${#numbers.formatDecimal(openPercent, 1, 1)} + '%'">0%</span></div><div class="track"><i th:style="'width:' + ${openPercent} + '%'"></i></div></div>
      <div class="meter"><div><span>In progress</span><span th:text="${#numbers.formatDecimal(progressPercent, 1, 1)} + '%'">0%</span></div><div class="track"><i th:style="'width:' + ${progressPercent} + '%'"></i></div></div>
      <div class="meter"><div><span>Resolved</span><span th:text="${#numbers.formatDecimal(resolvedPercent, 1, 1)} + '%'">0%</span></div><div class="track"><i th:style="'width:' + ${resolvedPercent} + '%'"></i></div></div>
      <div class="meter"><div><span>Critical priority</span><span th:text="${#numbers.formatDecimal(criticalPercent, 1, 1)} + '%'">0%</span></div><div class="track"><i th:style="'width:' + ${criticalPercent} + '%'"></i></div></div>
    </div>
    <div class="stack">
      <div class="card">
        <h3>Accounts</h3>
        <div class="kv"><span>Active</span><span class="val" th:text="${@fmt.number(enabledUsers)}">0</span></div>
        <div class="kv"><span>Disabled</span><span class="val" th:text="${@fmt.number(disabledUsers)}">0</span></div>
      </div>
      <div class="card">
        <h3>Most tickets submitted</h3>
        <div class="kv" th:each="user, it : ${topUsers}" th:if="${it.index < 8}"><span class="mono" th:text="${user[0]}">username</span><span class="val" th:text="${@fmt.number(user[1])}">0</span></div>
        <div class="empty" th:if="${#lists.isEmpty(topUsers)}">No tickets yet.</div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
