<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: page('Ticket #' + ${ticket.id}, 'tickets', ~{::main})}">
<body>
<main class="view">
  <a class="back" th:href="${staff == true} ? @{/dashboard/} : @{/home}">‹ Tickets</a>
  <div class="head">
    <h1 th:text="${ticket.title}">Subject</h1>
    <span class="mono" th:text="'#' + ${ticket.id}">#1</span>
  </div>
  <div class="detail">
    <div class="card">
      <div data-live>
        <div class="msg">
          <span class="avatar" th:text="${@fmt.initials(ticket.requestor)}">AB</span>
          <div>
            <div class="meta"><b th:text="${ticket.requestor}">Requester</b><span><time th:replace="~{parts :: when(${ticket.ticketDate}, ${ticket.ticketTime})}"></time></span></div>
            <p th:text="${ticket.description}">Description</p>
          </div>
        </div>
        <!--/* Internal notes are only rendered for staff. */-->
        <th:block th:each="note : ${ticket.notes}">
          <div class="msg" th:if="${!note.internalNote or staff == true}" th:classappend="${note.internalNote} ? 'internal'">
            <span class="avatar" th:text="${@fmt.initials(note.username)}">AB</span>
            <div>
              <div class="meta"><b th:text="${note.username}">user</b><span class="lock" th:if="${note.internalNote}">Internal note</span><span><time th:replace="~{parts :: when(${note.ticketNoteDate}, ${note.ticketNoteTime})}"></time></span></div>
              <p th:text="${note.note}">Note</p>
            </div>
          </div>
        </th:block>
      </div>
      <form class="reply" method="post" th:action="@{/tickets/{id}/newnote(id=${ticket.id})}">
        <label class="sr" for="note">Reply</label>
        <textarea id="note" name="note" required maxlength="5000" placeholder="Write a reply"></textarea>
        <div class="row">
          <button class="btn tint" type="submit">Send</button>
          <label class="check" sec:authorize="hasAnyRole('TECHNICIAN','ADMIN','SYSADMIN')"><input type="checkbox" name="internal" value="true"><span>Internal note (hidden from the requester)</span></label>
        </div>
      </form>
    </div>

    <aside class="stack">
      <form class="card" method="post" th:action="@{/tickets/{id}/update(id=${ticket.id})}" sec:authorize="hasAnyRole('TECHNICIAN','ADMIN','SYSADMIN')">
        <label class="kv"><span>Status</span>
          <select name="ticketStatus"><option th:each="s : ${@fmt.statuses()}" th:value="${s}" th:text="${@fmt.label(s)}" th:selected="${s == ticket.ticketStatus}">Open</option></select></label>
        <label class="kv"><span>Priority</span>
          <select name="importance"><option th:each="p : ${@fmt.importances()}" th:value="${p}" th:text="${@fmt.label(p)}" th:selected="${p == ticket.importance}">Low</option></select></label>
        <label class="kv"><span>Assignee</span>
          <select name="agentUsername">
            <option value="">Unassigned</option>
            <option th:each="agent : ${agents}" th:value="${agent.username}" th:selected="${agent.username == ticket.agentUsername}"
                    th:text="${agent.firstName + ' ' + agent.lastName + (agent.username == #authentication.name ? ' (me)' : '')}">Agent</option>
          </select></label>
        <label class="kv"><span>Department</span>
          <select name="department"><option th:each="d : ${@fmt.departments()}" th:value="${d}" th:text="${@fmt.label(d)}" th:selected="${d == ticket.department}">Dept</option></select></label>
        <div class="actions"><button class="btn tint" type="submit">Save changes</button></div>
      </form>

      <!--/* Requesters get a read-only summary: no assignee name, no internal fields. */-->
      <div class="card" sec:authorize="hasRole('USER')">
        <div class="kv"><span>Status</span><span th:replace="~{parts :: status(${ticket.ticketStatus})}"></span></div>
        <div class="kv"><span>Priority</span><span th:replace="~{parts :: prio(${ticket.importance})}"></span></div>
        <div class="kv"><span>Department</span><span class="val" th:text="${@fmt.label(ticket.department)}">Dept</span></div>
        <div class="kv"><span>Handled by</span><span class="val" th:text="${ticket.agent != null ? 'Support team' : 'Not yet assigned'}">Support team</span></div>
        <div class="kv"><span>Opened</span><span class="val"><time th:replace="~{parts :: when(${ticket.ticketDate}, ${ticket.ticketTime})}"></time></span></div>
      </div>

      <div class="card" sec:authorize="hasAnyRole('TECHNICIAN','ADMIN','SYSADMIN')">
        <h3>Requester</h3>
        <div class="kv"><span class="who"><span class="avatar" th:text="${@fmt.initials(ticket.requestor)}">AB</span><span th:text="${ticket.requestor}">Name</span></span></div>
        <div class="kv"><span>Account</span><a class="val" th:href="@{/dashboard/users/{u}(u=${ticket.requestorUsername})}" th:text="${ticket.requestorUsername}">username</a></div>
        <div class="kv"><span>Opened</span><span class="val"><time th:replace="~{parts :: when(${ticket.ticketDate}, ${ticket.ticketTime})}"></time></span></div>
      </div>
    </aside>
  </div>
</main>
</body>
</html>
