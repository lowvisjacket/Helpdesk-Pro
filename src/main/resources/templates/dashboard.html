<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Tickets', 'tickets', ~{::main})}">
<body>
<main class="view" th:with="target=${activeView != null ? activeView : fromView}">
  <div class="head">
    <h1 th:text="${activeView != null ? activeView.name : (custom ? 'Filtered tickets' : 'All open')}">All open</h1>
    <span class="sub" th:text="${@fmt.count(totalTickets, 'ticket', 'tickets')}">0 tickets</span>
    <div class="grow"></div>
    <details class="dd right">
      <summary class="btn">Save view</summary>
      <form class="pop" method="post" th:action="@{/views}" style="width:250px">
        <input type="hidden" name="filters" th:value="${filter.toQuery()}">
        <input type="hidden" name="columns" th:value="${#strings.setJoin(cols, ',')}">
        <input type="hidden" name="sort" th:value="${filter.sort()}">
        <label class="field"><span>Name</span><input class="input" name="name" maxlength="60" required placeholder="e.g. My urgent tickets"></label>
        <label class="check" style="margin-bottom:.5rem"><input type="checkbox" name="makeDefault" value="true"><span>Open this view by default</span></label>
        <button class="btn tint block" type="submit">Save as new view</button>
        <button th:if="${target != null}" class="btn block" style="margin-top:.4rem" type="submit" formnovalidate
                th:formaction="@{/views/{id}/save(id=${target.id})}" th:text="'Update “' + ${target.name} + '”'">Update</button>
      </form>
    </details>
  </div>

  <nav class="tabs" aria-label="Views">
    <a th:href="@{/dashboard/(view=0)}" th:classappend="${activeView == null and !custom} ? 'on'">All open</a>
    <a th:each="v : ${navViews}" th:href="@{/dashboard/(view=${v.id})}" th:text="${v.name}"
       th:classappend="${activeView != null and activeView.id == v.id} ? 'on'">View</a>
    <a th:if="${custom}" class="on" aria-current="page">Unsaved filter</a>
  </nav>

  <form class="tools" method="get" th:action="@{/dashboard/}">
    <input type="hidden" name="f" value="1">
    <input type="hidden" name="from" th:if="${target != null}" th:value="${target.id}">
    <details class="dd">
      <summary class="chip">Status <b th:text="${filter.statuses().isEmpty() ? 'Any' : filter.statuses().size()}">Any</b></summary>
      <div class="pop">
        <label class="check" th:each="s : ${@fmt.statuses()}"><input type="checkbox" name="status" th:value="${s}" th:checked="${filter.statuses().contains(s)}"><span th:text="${@fmt.label(s)}">Open</span></label>
      </div>
    </details>
    <details class="dd">
      <summary class="chip">Priority <b th:text="${filter.importances().isEmpty() ? 'Any' : filter.importances().size()}">Any</b></summary>
      <div class="pop">
        <label class="check" th:each="p : ${@fmt.importances()}"><input type="checkbox" name="importance" th:value="${p}" th:checked="${filter.importances().contains(p)}"><span th:text="${@fmt.label(p)}">Low</span></label>
      </div>
    </details>
    <select class="chip" name="department" aria-label="Department">
      <option value="">Any department</option>
      <option th:each="d : ${@fmt.departments()}" th:value="${d}" th:text="${@fmt.label(d)}" th:selected="${d == filter.department()}">Dept</option>
    </select>
    <select class="chip" name="assignee" aria-label="Assignee">
      <option value="any" th:selected="${filter.assignee() == 'any'}">Any assignee</option>
      <option value="me" th:selected="${filter.assignee() == 'me'}">Assigned to me</option>
      <option value="unassigned" th:selected="${filter.assignee() == 'unassigned'}">Unassigned</option>
    </select>
    <select class="chip" name="sort" aria-label="Sort by">
      <option th:each="s : ${@fmt.sorts()}" th:value="${s}" th:text="'Sort: ' + ${s}" th:selected="${s == filter.sort()}">Sort</option>
    </select>
    <details class="dd">
      <summary class="chip">Columns <b th:text="${cols.size()}">6</b></summary>
      <div class="pop">
        <label class="check" th:each="c : ${@fmt.columns()}"><input type="checkbox" name="col" th:value="${c}" th:checked="${cols.contains(c)}"><span th:text="${@fmt.label(c)}">Column</span></label>
      </div>
    </details>
    <input class="chip" type="search" name="q" th:value="${filter.q()}" placeholder="Search" aria-label="Search tickets" maxlength="100">
    <button class="btn" type="submit">Apply</button>
  </form>

  <div class="card" data-live>
    <div class="table-wrap">
      <table th:if="${!#lists.isEmpty(tickets)}">
        <thead><tr>
          <th>ID</th><th>Subject</th>
          <th th:if="${cols.contains('requester')}" class="hide-sm">Requester</th>
          <th th:if="${cols.contains('status')}">Status</th>
          <th th:if="${cols.contains('priority')}">Priority</th>
          <th th:if="${cols.contains('department')}" class="hide-sm">Department</th>
          <th th:if="${cols.contains('assignee')}" class="hide-sm">Assignee</th>
          <th th:if="${cols.contains('created')}" class="hide-sm">Created</th>
        </tr></thead>
        <tbody>
        <tr th:each="t : ${tickets}" th:data-href="@{/dashboard/details/{id}(id=${t.id})}">
          <td class="mono" th:text="${t.id}">1</td>
          <td class="subj"><a th:href="@{/dashboard/details/{id}(id=${t.id})}" th:text="${t.title}" th:title="${t.title}">Subject</a></td>
          <td th:if="${cols.contains('requester')}" class="hide-sm"><span class="who"><span class="avatar" th:text="${@fmt.initials(t.requestor)}">AB</span><span class="trunc" th:text="${t.requestor}" th:title="${t.requestor}">Name</span></span></td>
          <td th:if="${cols.contains('status')}"><span th:replace="~{parts :: status(${t.ticketStatus})}"></span></td>
          <td th:if="${cols.contains('priority')}"><span th:replace="~{parts :: prio(${t.importance})}"></span></td>
          <td th:if="${cols.contains('department')}" class="hide-sm"><span class="trunc" th:text="${@fmt.label(t.department)}" th:title="${@fmt.label(t.department)}">Dept</span></td>
          <td th:if="${cols.contains('assignee')}" class="hide-sm"><span class="trunc" th:classappend="${t.agent == null} ? 'sub'" th:title="${t.agent}"
              th:text="${t.agent == null ? 'Unassigned' : t.agent + (t.agentUsername == #authentication.name ? ' (me)' : '')}">Agent</span></td>
          <td th:if="${cols.contains('created')}" class="hide-sm sub"><time th:replace="~{parts :: day(${t.ticketDate}, ${t.ticketTime})}"></time></td>
        </tr>
        </tbody>
      </table>
    </div>
    <div class="empty" th:if="${#lists.isEmpty(tickets)}">No tickets match this view.</div>
    <div class="foot" th:if="${pageCount > 1}">
      <span th:text="${@fmt.number(firstRow) + '–' + @fmt.number(lastRow) + ' of ' + @fmt.number(totalTickets)}">1–50 of 120</span>
      <span class="grow"></span>
      <a class="btn" th:if="${page > 1}" th:href="@{${'/dashboard/?' + baseQuery + '&page=' + (page - 1)}}">Previous</a>
      <a class="btn" th:if="${page < pageCount}" th:href="@{${'/dashboard/?' + baseQuery + '&page=' + (page + 1)}}">Next</a>
    </div>
  </div>
</main>
</body>
</html>
