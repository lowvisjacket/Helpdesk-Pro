<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <title>Helpdesk Dashboard</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Inter",Arial,sans-serif;
        }


        body{

            background:#f8fafc;
            color:#1e293b;

        }



        /* SIDEBAR */

        .sidebar{

            width:260px;
            height:100vh;

            position:fixed;

            background:#0f172a;

            color:white;

            padding:25px;

        }


        .brand{

            font-size:24px;
            font-weight:700;

            margin-bottom:40px;

        }


        .menu a{

            display:flex;

            align-items:center;

            padding:13px 15px;

            margin-bottom:8px;

            color:#cbd5e1;

            text-decoration:none;

            border-radius:10px;

        }


        .menu a:hover{

            background:#1e293b;

            color:white;

        }





        /* MAIN */


        .main{

            margin-left:260px;

        }



        .top-header{

            height:75px;

            background:white;

            border-bottom:1px solid #e2e8f0;

            display:flex;

            align-items:center;

            justify-content:space-between;

            padding:0 35px;

        }



        .profile{

            display:flex;

            align-items:center;

            gap:15px;

        }


        .logout{

            background:#ef4444;

            border:none;

            color:white;

            padding:9px 18px;

            border-radius:8px;

            cursor:pointer;

        }




        .content{

            padding:35px;

        }




        /* SUMMARY */


        .summary{

            display:grid;

            grid-template-columns:repeat(4,1fr);

            gap:20px;

            margin-bottom:35px;

        }


        .summary-card{

            background:white;

            padding:22px;

            border-radius:14px;

            box-shadow:0 4px 15px rgba(0,0,0,.05);

        }


        .summary-title{

            color:#64748b;

            font-size:14px;

        }


        .summary-number{

            font-size:28px;

            font-weight:bold;

            margin-top:8px;

        }




        /* TOOLBAR */


        .toolbar{

            display:flex;

            justify-content:space-between;

            align-items:center;

            margin-bottom:20px;

        }


        .create{

            background:#2563eb;

            color:white;

            border:none;

            padding:12px 22px;

            border-radius:9px;

            cursor:pointer;

            font-weight:600;

        }





        /* TICKETS */


        .ticket-list{

            background:white;

            border-radius:14px;

            overflow:hidden;

            box-shadow:0 4px 18px rgba(0,0,0,.06);

        }




        .ticket-row{

            padding:22px;

            border-bottom:1px solid #e5e7eb;

            display:grid;

            grid-template-columns:2fr 1fr 1fr 1fr 120px;

            align-items:center;

        }


        .ticket-row:hover{

            background:#f8fafc;

        }




        .ticket-title{

            font-weight:700;

            color:#0f172a;

        }



        .small{

            color:#64748b;

            font-size:14px;

        }




        .badge{

            display:inline-block;

            padding:6px 12px;

            border-radius:20px;

            font-size:13px;

            font-weight:600;

        }



        .open{

            background:#dcfce7;

            color:#166534;

        }


        .progress{

            background:#fef3c7;

            color:#92400e;

        }


        .resolved{

            background:#dbeafe;

            color:#1e40af;

        }


        .closed{

            background:#e5e7eb;

            color:#374151;

        }



        .priority-high{

            color:#dc2626;

            font-weight:bold;

        }



        .priority-low{

            color:#16a34a;

        }




        .view{

            background:#0f766e;

            color:white;

            border:none;

            padding:9px 16px;

            border-radius:7px;

            cursor:pointer;

        }





        .empty{

            padding:50px;

            text-align:center;

            background:white;

        }



        @media(max-width:1000px){

        .sidebar{

            display:none;

        }

        .main{

            margin-left:0;

        }


        .ticket-row{

            grid-template-columns:1fr;

            gap:15px;

        }


        .summary{

            grid-template-columns:1fr;

        }


        }


    </style>

</head>


<body>



<div class="sidebar">


    <div class="brand">
        HelpDesk Pro
    </div>



    <div class="menu">

        <a href="/dashboard/">
            Dashboard
        </a>

        <a href="/dashboard/users">
            Users
        </a>

        <a href="/dashboard/reports">
            Reports
        </a>

    </div>


</div>




<div class="main">



    <header class="top-header">


        <h2>
            Support Center
        </h2>


        <div class="profile">


<span th:text="${username}">
User
</span>


            <form th:action="@{/logout}" method="post">

                <button class="logout">
                    Logout
                </button>

            </form>


        </div>


    </header>





    <div class="content">





        <div class="summary">


            <div class="summary-card">

                <div class="summary-title">
                    Open Tickets
                </div>

                <div class="summary-number"
                     th:text="${tickets.size()}">
                    0
                </div>


            </div>
        </div>






        <div class="toolbar">


            <h2>
                Tickets
            </h2>



            <form th:action="@{/dashboard/create}"
                  method="get">

                <button class="create">

                    + New Ticket

                </button>


            </form>


        </div>





        <div class="ticket-list">



            <div class="empty"
                 th:if="${#lists.isEmpty(tickets)}">

                No tickets found

            </div>





            <div class="ticket-row"
                 th:each="ticket:${tickets}">



                <div>

                    <div class="ticket-title"
                         th:text="${ticket.title}">

                    </div>

                    <div class="small"
                         th:text="${ticket.department}">

                    </div>

                </div>





                <div>

<span class="badge"

      th:classappend="
${ticket.ticketStatus=='OPEN'}?' open':
(${ticket.ticketStatus=='IN_PROGRESS'}?' progress':
(${ticket.ticketStatus=='RESOLVED'}?' resolved':' closed'))"

      th:text="${ticket.ticketStatus}">

</span>


                </div>





                <div>

<span class="small">
Agent
</span>

                    <br>

                    <span th:text="${ticket.agent ?: 'Unassigned'}">

</span>


                </div>





                <div>

<span class="small">
Priority
</span>

                    <br>


                    <span th:text="${ticket.importance}"

                          th:classappend="
${ticket.importance=='HIGH' || ticket.importance=='CRITICAL'}?' priority-high':
' priority-low'">

</span>


                </div>






                <div>


                    <form th:action="@{/dashboard/details/{id}(id=${ticket.id})}"
                          method="get">


                        <button class="view">

                            Open

                        </button>


                    </form>


                </div>



            </div>





        </div>



    </div>



</div>



</body>

</html>
