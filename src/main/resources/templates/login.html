<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{parts :: head('Sign in')}"></head>
<body>
<div class="center">
  <div class="auth">
    <div class="brand"><span class="logo">hp</span>helpdesk-pro</div>
    <div class="card">
      <h1>Sign in</h1>
      <p>Use the account your administrator set up for you.</p>
      <div class="note-banner err" th:if="${param.error}" role="alert">That username or password isn't right. Try again.</div>
      <div class="note-banner ok" th:if="${param.logout}" role="status">You've signed out.</div>
      <form method="post" th:action="@{/auth/login}">
        <label class="field"><span>Username</span>
          <input class="input" type="text" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></label>
        <label class="field"><span>Password</span>
          <input class="input" type="password" name="password" autocomplete="current-password" required></label>
        <button class="btn tint block" type="submit">Sign in</button>
      </form>
    </div>
    <p class="fine">No account? Ask your helpdesk administrator to create one.</p>
  </div>
</div>
</body>
</html>
