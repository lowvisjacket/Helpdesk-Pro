<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Ticket</title>


    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Inter",Arial,sans-serif;
        }


        body{

            background:#f8fafc;

            color:#1e293b;

        }





        /* HEADER */


        header{

            height:75px;

            background:white;

            border-bottom:1px solid #e2e8f0;

            display:flex;

            align-items:center;

            padding:0 35px;

            box-shadow:0 2px 8px rgba(0,0,0,.04);

        }



        header h1{

            color:#0f172a;

            font-size:26px;

            font-weight:700;

        }





        /* MAIN CARD */


        .container{

            max-width:850px;

            margin:40px auto;

            background:white;

            border-radius:14px;

            padding:35px;

            box-shadow:0 4px 15px rgba(0,0,0,.06);

        }




        .container h2{

            color:#0f172a;

            font-size:24px;

            margin-bottom:30px;

        }





        /* FORM */


        .form-group{

            margin-bottom:25px;

        }



        label{

            display:block;

            color:#64748b;

            font-size:13px;

            font-weight:600;

            margin-bottom:8px;

        }





        input,
        select,
        textarea{


            width:100%;

            padding:13px;

            border-radius:8px;

            border:1px solid #e2e8f0;

            background:#f8fafc;

            font-size:15px;

            color:#1e293b;

            transition:.2s;

        }




        input:focus,
        select:focus,
        textarea:focus{

            outline:none;

            border-color:#2563eb;

            background:white;

        }




        textarea{

            min-height:180px;

            resize:vertical;

        }





        .row{

            display:grid;

            grid-template-columns:1fr 1fr;

            gap:25px;

        }





        /* BUTTONS */


        .buttons{

            display:flex;

            justify-content:flex-end;

            gap:15px;

            margin-top:35px;

        }





        .btn{

            padding:12px 24px;

            border:none;

            border-radius:8px;

            cursor:pointer;

            font-weight:600;

            font-size:15px;

            transition:.2s;

        }





        .btn-primary{

            background:#2563eb;

            color:white;

        }




        .btn-primary:hover{

            background:#1d4ed8;

        }





        .btn-secondary{

            background:#64748b;

            color:white;

        }




        .btn-secondary:hover{

            background:#475569;

        }





        @media(max-width:700px){


            .container{

                margin:20px;

                padding:25px;

            }



            .row{

                grid-template-columns:1fr;

            }


        }



    </style>


</head>



<body>



<header>

    <h1>
        Submit a Ticket
    </h1>

</header>





<div class="container">



    <h2>
        New Ticket
    </h2>





    <form th:action="@{/tickets/newticket}"
          method="post">






        <div class="row">



            <div class="form-group">


                <label>
                    Requestor Name
                </label>


                <input
                        type="text"
                        name="requestor"
                        placeholder="Enter your name"
                        required>


            </div>







            <div class="form-group">


                <label>
                    Department
                </label>



                <select name="department"
                        required>


                    <option value="">
                        Select Department
                    </option>


                    <option value="IT">
                        IT
                    </option>


                    <option value="Engineering">
                        Engineering
                    </option>


                    <option value="Finance">
                        Finance
                    </option>


                    <option value="Human Resources">
                        Human Resources
                    </option>


                    <option value="Marketing">
                        Marketing
                    </option>


                    <option value="Sales">
                        Sales
                    </option>


                    <option value="Operations">
                        Operations
                    </option>


                </select>


            </div>


        </div>







        <div class="form-group">


            <label>
                Ticket Title
            </label>



            <input
                    type="text"
                    name="title"
                    maxlength="100"
                    placeholder="Brief description of the issue"
                    required>


        </div>








        <div class="form-group">


            <label>
                Description
            </label>



            <textarea
                    name="description"
                    placeholder="Describe the issue in as much detail as possible..."
                    required></textarea>


        </div>







        <div class="buttons">



            <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="window.location.href='/dashboard/'">


                Cancel


            </button>







            <button
                    type="submit"
                    class="btn btn-primary">


                Create Ticket


            </button>




        </div>





    </form>




</div>




</body>

</html>
