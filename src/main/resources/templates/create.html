<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('New ticket', 'new', ~{::main})}">
<body>
<main class="view">
  <div class="narrow">
    <div class="head"><h1>New ticket</h1></div>
    <form class="card pad" method="post" th:action="@{/tickets/newticket}">
      <label class="field"><span>Requester name</span>
        <input class="input" name="requestor" th:value="${me?.fullName}" maxlength="120" required></label>
      <label class="field"><span>Subject</span>
        <input class="input" name="title" maxlength="200" required placeholder="A short summary of the problem"></label>
      <label class="field"><span>Department</span>
        <select class="input" name="department" required>
          <option value="">Choose a department</option>
          <option th:each="d : ${@fmt.departments()}" th:value="${d}" th:text="${@fmt.label(d)}">Dept</option>
        </select></label>
      <label class="field"><span>Description</span>
        <textarea class="input" name="description" required maxlength="5000" placeholder="What happened, and what did you expect?"></textarea></label>
      <button class="btn tint" type="submit">Create ticket</button>
      <a class="btn plain" th:href="@{/}">Cancel</a>
    </form>
  </div>
</main>
</body>
</html>
