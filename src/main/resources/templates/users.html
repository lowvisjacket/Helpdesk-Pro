<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: page('Users', 'users', ~{::main})}">
<body>
<main class="view">
  <div class="head">
    <h1>Users</h1>
    <div class="grow"></div>
    <a class="btn" sec:authorize="hasAnyRole('ADMIN','SYSADMIN')" th:href="@{/dashboard/users/create}"><svg class="i"><use href="#i-plus"/></svg>New user</a>
  </div>
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Name</th><th class="hide-sm">Username</th><th class="hide-sm">Department</th><th>Role</th><th>Status</th><th sec:authorize="hasRole('SYSADMIN')" class="hide-sm"><span class="sr">Actions</span></th></tr></thead>
        <tbody>
        <tr th:each="user : ${users}" th:data-href="@{/dashboard/users/{username}(username=${user.username})}">
          <td class="subj"><span class="who"><span class="avatar" th:text="${@fmt.initials(user.firstName + ' ' + user.lastName)}">AB</span>
            <a th:href="@{/dashboard/users/{username}(username=${user.username})}" th:text="${user.firstName + ' ' + user.lastName}">Name</a></span></td>
          <td class="hide-sm mono" th:text="${user.username}">username</td>
          <td class="hide-sm" th:text="${@fmt.label(user.department)}">Dept</td>
          <td th:text="${@fmt.label(user.role)}">Role</td>
          <td><span class="badge" th:classappend="${user.accountStatus} ? 'st-on' : 'st-off'" th:text="${user.accountStatus ? 'Active' : 'Disabled'}">Active</span></td>
          <td sec:authorize="hasRole('SYSADMIN')" class="hide-sm">
            <form th:if="${user.username != #authentication.name}" method="post" th:action="@{/dashboard/users/{username}/delete(username=${user.username})}"
                  th:data-confirm="'Delete ' + ${user.username} + '? This cannot be undone.'"><button class="btn plain danger" type="submit">Delete</button></form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
</body>
</html>
