<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">
    <title>User Management</title>


    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Inter",Arial,sans-serif;
        }


        body{
            background:#f8fafc;
            color:#1e293b;
        }


        /* SIDEBAR */

        .sidebar{

            position:fixed;
            width:260px;
            height:100vh;

            background:#0f172a;
            color:white;

            padding:25px;

        }


        .brand{

            font-size:24px;
            font-weight:700;
            margin-bottom:40px;

        }



        .menu a{

            display:block;

            padding:12px 15px;

            color:#cbd5e1;

            text-decoration:none;

            border-radius:8px;

            margin-bottom:8px;

        }


        .menu a:hover{

            background:#1e293b;

            color:white;

        }




        /* MAIN */

        .main{

            margin-left:260px;

        }



        .header{

            height:75px;

            background:white;

            border-bottom:1px solid #e2e8f0;

            display:flex;

            justify-content:space-between;

            align-items:center;

            padding:0 35px;

        }



        .logout{

            background:#ef4444;

            color:white;

            border:none;

            padding:10px 18px;

            border-radius:8px;

            cursor:pointer;

        }





        .content{

            padding:35px;

        }




        /* CARD */


        .card{

            background:white;

            border-radius:14px;

            padding:25px;

            box-shadow:0 4px 15px rgba(0,0,0,.06);

        }



        .card-header{

            display:flex;

            justify-content:space-between;

            align-items:center;

            margin-bottom:25px;

        }



        .add-btn{

            background:#2563eb;

            color:white;

            border:none;

            padding:11px 20px;

            border-radius:8px;

            cursor:pointer;

            font-weight:600;

        }


        .add-btn:hover{

            background:#1d4ed8;

        }





        /* TABLE */


        table{

            width:100%;

            border-collapse:collapse;

        }



        thead{

            background:#f1f5f9;

        }



        th{

            padding:14px;

            text-align:left;

            color:#64748b;

            font-size:14px;

        }



        td{

            padding:15px;

            border-bottom:1px solid #e2e8f0;

        }



        .clickable-row{

            cursor:pointer;

        }



        .clickable-row:hover{

            background:#f8fafc;

        }





        .user-link{

            text-decoration:none;

            color:#1e293b;

        }



        .user-link:hover{

            color:#2563eb;

        }





        /* BADGES */


        .badge{

            display:inline-block;

            padding:6px 12px;

            border-radius:20px;

            font-size:13px;

            font-weight:bold;

        }



        .role{

            background:#dbeafe;

            color:#1e40af;

        }



        .active{

            background:#dcfce7;

            color:#166534;

        }



        .inactive{

            background:#fee2e2;

            color:#991b1b;

        }





        /* DELETE */


        .delete{

            background:#dc2626;

            color:white;

            border:none;

            padding:8px 14px;

            border-radius:7px;

            cursor:pointer;

        }


        .delete:hover{

            background:#b91c1c;

        }




        @media(max-width:900px){

        .sidebar{

        display:none;

        }


        .main{

        margin-left:0;

        }


        .content{

        padding:20px;

        }


        }



    </style>


</head>



<body>



<!-- SIDEBAR -->


<div class="sidebar">


    <div class="brand">

        HelpDesk Pro

    </div>



    <div class="menu">


        <a href="/dashboard/">

            Dashboard

        </a>



        <a href="/dashboard/users"
           sec:authorize="hasAnyAuthority('TECHNICIAN','ADMIN','SYSADMIN')">

            Users

        </a>

        <a href="/dashboard/reports">
            Reports
        </a>



    </div>


</div>






<!-- MAIN -->


<div class="main">


    <div class="header">


        <h2>

            User Management

        </h2>



        <form th:action="@{/logout}"
              method="post">


            <button class="logout">

                Logout

            </button>


        </form>


    </div>





    <div class="content">


        <div class="card">



            <div class="card-header">


                <h2>

                    Users

                </h2>



                <form th:action="@{/users/create}"
                      method="get"
                      sec:authorize="hasAnyRole('ADMIN','SYSADMIN')">


                    <button class="add-btn">

                        Add User

                    </button>


                </form>


            </div>





            <table>


                <thead>

                <tr>

                    <th>
                        Name
                    </th>

                    <th>
                        Username
                    </th>

                    <th>
                        Department
                    </th>

                    <th>
                        Role
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Actions
                    </th>


                </tr>

                </thead>





                <tbody>



                <tr th:each="user:${users}"
                    class="clickable-row">

                    <td>

                        <a class="user-link"
                           th:href="@{/dashboard/users/{username}(username=${user.username})}">

                            <strong th:text="${user.firstName + ' ' + user.lastName}">
                                Name
                            </strong>

                        </a>

                    </td>


                    <td th:text="${user.username}">
                        Username
                    </td>


                    <td th:text="${user.department}">
                        Department
                    </td>


                    <td>

        <span class="badge role"
              th:text="${user.role}">
            Role
        </span>

                    </td>


                    <td>

        <span class="badge"
              th:classappend="${user.accountStatus} ? 'active':'inactive'"
              th:text="${user.accountStatus ? 'Active':'Inactive'}">

        </span>

                    </td>


                    <td>

                        <form th:action="@{/users/{uuid}/delete(uuid=${user.uuid})}"
                              method="post"
                              sec:authorize="hasRole('SYSADMIN')">

                            <button class="delete"
                                    onclick="event.stopPropagation(); return confirm('Delete this user?')">

                                Delete

                            </button>

                        </form>

                    </td>

                </tr>



                </tbody>


            </table>


        </div>


    </div>


</div>

<script>
    document.querySelectorAll(".clickable-row").forEach(row => {

        row.addEventListener("click", function(){

            const link = this.querySelector(".user-link");

            if(link){
                window.location.href = link.href;
            }

        });

    });
</script>

</body>

</html>
