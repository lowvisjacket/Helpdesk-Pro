spring.application.name=helpdesk-pro
server.port=${SERVER_PORT:8081}

# Database. Every value can be overridden with an environment variable.
# The defaults match the development credentials used in compose.yaml.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/helpdesk_pro}
spring.datasource.username=${DB_USERNAME:ticketing}
spring.datasource.password=${DB_PASSWORD:ticketing_local}

# Schema management. compose.yaml sets JPA_DDL_AUTO=update for the local demo stack.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
# Entities and native queries use camelCase column names, so keep names exactly as written.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Demo seed data. Only used when the "demo" Spring profile is active.
demo.seed.password=${DEMO_SEED_PASSWORD:test123}

# Health endpoint used by the Docker health checks.
management.endpoints.web.exposure.include=health
