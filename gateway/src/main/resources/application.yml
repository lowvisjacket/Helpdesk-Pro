server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ticketing-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
  cloud:
    gateway:
      routes:
        - id: ticketing-application
          uri: ${TICKETING_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@remoteAddressKeyResolver}"
                redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH_RATE:10}
                redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST_CAPACITY:20}
                redis-rate-limiter.requestedTokens: 1
            - name: CircuitBreaker
              args:
                name: ticketingBackend
                fallbackUri: forward:/fallback

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

resilience4j:
  circuitbreaker:
    instances:
      ticketingBackend:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
